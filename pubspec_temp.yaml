name: flutter_application_1
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # BDL App Dependencies - 使用 sqflite 而不是 sqlite3
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.9.0
  image_picker: ^1.0.7
  pdf: ^3.10.7
  printing: ^5.12.0
  share_plus: ^7.2.2
  flutter_email_sender: ^6.0.3
  vibration: ^1.8.4
  audioplayers: ^5.2.1
  fl_chart: ^0.66.0
  graphic: ^2.2.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  provider: ^6.1.2
  
  # 3D Graph Support
  flutter_inappwebview: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/graphs/
    - assets/images/
    - assets/animations/
